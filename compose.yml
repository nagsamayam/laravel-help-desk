networks:
  monitoring:
    name: monitoring

services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    networks:
      - monitoring
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_help_desk}
      MYSQL_PASSWORD: ${DB_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$${DB_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  pmm-server:
    image: percona/pmm-server:3
    platform: linux/amd64
    ports:
      - "8443:8443"
    networks:
      - monitoring
    volumes:
      - pmm_data:/srv
    restart: always
    environment:
      - PMM_DATA_RETENTION=720h
    healthcheck:
      test: ["CMD", "curl", "-k", "https://localhost:8443/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pmm-client:
    image: percona/pmm-client:3
    platform: linux/amd64
    container_name: pmm-client
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      mysql:
        condition: service_healthy
      pmm-server:
        condition: service_started  # Ensures the PMM server API is fully running first
    environment:
      # PMM Server
      - PMM_AGENT_CONFIG_FILE=/tmp/pmm-agent.yaml
      - PMM_AGENT_SERVER_ADDRESS=pmm-server:8443
      - PMM_AGENT_SERVER_USERNAME=admin
      - PMM_AGENT_SERVER_PASSWORD=${PMM_AGENT_SERVER_PASSWORD}
      - PMM_AGENT_SERVER_INSECURE_TLS=true
      
      # Automatically initialize PMM Agent
      - PMM_AGENT_SETUP=true
      - PMM_AGENT_SETUP_FORCE=true 
      - PMM_AGENT_SETUP_NODE_NAME=mysql-node
      - PMM_AGENT_SETUP_NODE_TYPE=container

      # Automatically register MySQL
      - PMM_AGENT_SETUP_SERVICE_TYPE=mysql
      - PMM_AGENT_SETUP_SERVICE_NAME=local-docker-mysql
      - PMM_AGENT_SETUP_HOST=${PMM_AGENT_SETUP_HOST}
      - PMM_AGENT_SETUP_PORT=${PMM_AGENT_SETUP_PORT}
      - PMM_AGENT_SETUP_USER=${PMM_AGENT_SETUP_USER}
      - PMM_AGENT_SETUP_PASSWORD=${PMM_AGENT_SETUP_PASSWORD}
      - PMM_AGENT_SETUP_QUERY_SOURCE=perfschema

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    command:
      - "--config.my-cnf=/.my.cnf"
    volumes:
      - ./prometheus/mysql/.my.cnf:/.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - monitoring

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    networks:
      - monitoring
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  mysql_data:
  redis_data:
  pmm_data:
  prometheus_data:
  grafana_data:
