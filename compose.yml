services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-larave_help_desk}
      MYSQL_PASSWORD: ${DB_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$${DB_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql_data: